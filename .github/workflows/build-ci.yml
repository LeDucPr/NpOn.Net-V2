name: NpOn.Net-V2 CI/CD & Automated Container Build

on:
  push:
    branches: [ "main", "master", "driver" ]
  pull_request:
    branches: [ "main", "master", "driver" ]
    types: [ closed, opened, synchronize ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ==============================================================================
  # GIAI DOAN 1: TEST TRUOC KHI BUILD (VERIFY & TEST GATE)
  # Dam bao 0 loi bien dich va toan bo Unit Tests phai vuot qua truoc khi dong goi
  # ==============================================================================
  verify-and-test:
    name: Verify Compilation & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Build & Pack Common & Shared Contracts (NuGet Feed)
        run: pwsh ./build-common.ps1 -Configuration Release

      - name: Restore Solution Dependencies
        run: dotnet restore NpOnV2.sln

      - name: Compile Entire Solution (Release)
        run: dotnet build NpOnV2.sln -c Release --no-restore

      - name: Run Automated Verification Tests
        run: dotnet test Test/NpOn.Core.Tests/NpOn.Core.Tests.csproj -c Release --no-build --filter "Category!=Integration" --verbosity normal

  # ==============================================================================
  # GIAI DOAN 2: BUILD DOCKER IMAGE & PUSH LEN GITHUB CONTAINER REGISTRY (GHCR)
  # Chi chay khi:
  #   1. verify-and-test thanh cong 100%
  #   2. Pull Request duoc MERGE HOAC Commit message chua "%buildCI%" (khong phan biet hoa thuong)
  # ==============================================================================
  build-and-push-images:
    name: Build & Push Microservices Container Images
    needs: verify-and-test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      contains(toLower(github.event.head_commit.message), 'buildci') ||
      contains(toLower(github.event.pull_request.title), 'buildci')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Convert Repository Owner to Lowercase
        id: repo_owner
        run: |
          # Docker/OCI yeu cau ten repository phai la chu thuong toan bo
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "lowercase=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "Target Registry Namespace: ghcr.io/${OWNER_LOWER}"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Pack Common & Shared Contracts (NuGet Feed)
        run: pwsh ./build-common.ps1 -Configuration Release

      - name: Restore Solution
        run: dotnet restore NpOnV2.sln

      # ------------------------------------------------------------------------
      # 1. Build & Push AccountService
      # ------------------------------------------------------------------------
      - name: Build & Publish Container - AccountService
        run: |
          dotnet publish MicroServices/Account/Service/NpOn.AccountService/NpOn.AccountService.csproj \
            -t:PublishContainer -c Release \
            --no-restore \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ steps.repo_owner.outputs.lowercase }}/account-service \
            -p:ContainerImageTag="" \
            -p:ContainerImageTags="latest;sha-${{ github.sha }}"

      # ------------------------------------------------------------------------
      # 2. Build & Push GeneralService
      # ------------------------------------------------------------------------
      - name: Build & Publish Container - GeneralService
        run: |
          dotnet publish MicroServices/General/Service/NpOn.GeneralService/NpOn.GeneralService.csproj \
            -t:PublishContainer -c Release \
            --no-restore \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ steps.repo_owner.outputs.lowercase }}/general-service \
            -p:ContainerImageTag="" \
            -p:ContainerImageTags="latest;sha-${{ github.sha }}"

      # ------------------------------------------------------------------------
      # 3. Build & Push SSO Controller
      # ------------------------------------------------------------------------
      - name: Build & Publish Container - SSO Controller
        run: |
          dotnet publish Controllers/NpOn.SSO/NpOn.SSO.csproj \
            -t:PublishContainer -c Release \
            --no-restore \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ steps.repo_owner.outputs.lowercase }}/sso-controller \
            -p:ContainerImageTag="" \
            -p:ContainerImageTags="latest;sha-${{ github.sha }}"

      # ========================================================================
      # GIAI DOAN 3: DON DEP VA CHI GIU LAI 2 IMAGE TAI KHO (LATEST + BAN LIEN KE)
      # ========================================================================
      - name: Prune Old Images - account-service (Keep only 2 versions)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'account-service'
          package-type: 'container'
          min-versions-to-keep: 2

      - name: Prune Old Images - general-service (Keep only 2 versions)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'general-service'
          package-type: 'container'
          min-versions-to-keep: 2

      - name: Prune Old Images - sso-controller (Keep only 2 versions)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'sso-controller'
          package-type: 'container'
          min-versions-to-keep: 2
