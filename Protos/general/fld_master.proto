syntax = "proto3";

option csharp_namespace = "NpOn.Protos.General.V1";

package npon.general.v1;

// Schema-First gRPC contract for GeneralService metadata & query execution lookups.
// Domain entities (*Domain) stay strictly isolated inside GeneralService.
service FldMasterProtoService {
  rpc GetExecCommand (TblFldExecutionCommand) returns (CommandRModelResponseProto);
  rpc GetExecution (TblFldExecutionCommand) returns (TblFldRModelListResponseProto);
  rpc BulkSyncQueries (BulkSyncQueriesCommand) returns (BulkSyncQueriesResponseProto);
}

message TblFldExecutionParamCommand {
  string param_name = 1;
}

message TblFldExecutionCommand {
  optional string tbl_master_id = 1;
  optional string code = 2;
  repeated TblFldExecutionParamCommand exec_params = 3;
}

message NpOnDbCommandParamRModel {
  string param_name = 1;
  optional string param_value = 2;
  optional int32 param_type = 3;
}

message CommandRModel {
  string command_text = 1;
  int32 exec_type = 2;
  int32 database_type = 3;
  repeated NpOnDbCommandParamRModel parameters = 4;
}

message CommandRModelResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  optional CommandRModel data = 7;
}

message TblFldRModel {
  optional string field_name = 1;
  optional int32 field_type = 2;
  optional int32 field_db_type = 3;
  optional string query = 4;
  optional string exec_func = 5;
  optional int32 exec_type = 6;
  optional int32 database_type = 7;
  optional string tbl_master_id = 8;
  optional string code = 9;
}

message TblFldRModelListResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  repeated TblFldRModel items = 7;
}

message FldQueryMasterSyncCommand {
  optional string id = 1;
  string field_name = 2;
  optional int32 field_type = 3;
  optional string field_type_string = 4;
  int32 order_sort = 5;
  optional string description = 6;
}

message TblMasterSyncItemCommand {
  optional string id = 1;
  string code = 2;
  optional string description = 3;
  optional string exec_func = 4;
  optional string query = 5;
  int32 exec_type = 6;
  optional string service_name = 7;
  optional int32 db_type = 8;
  repeated FldQueryMasterSyncCommand fields = 9;
}

message BulkSyncQueriesCommand {
  repeated TblMasterSyncItemCommand queries = 1;
  optional string deploy_version = 2;
  bool is_full_reload = 3;
}

message BulkSyncQueriesResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  int32 synced_count = 7;
  string deploy_version = 8;
  int32 broadcast_receivers = 9;
}
