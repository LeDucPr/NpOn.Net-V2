syntax = "proto3";

option csharp_namespace = "NpOn.Protos.Account.V1";

package npon.account.v1;

// =============================================================================
// Schema-First gRPC Contracts for AccountService
// Domain entities (*Domain) stay strictly isolated inside AccountService.
// =============================================================================

service AuthenticationProtoService {
  rpc Signup (AccountSignupCommand) returns (AccountLoginResponseProto);
  rpc ChangeAccountStatus (AccountSetStatusCommand) returns (CommonBoolResponseProto);
  rpc ChangeAccountPassword (AccountChangePasswordCommand) returns (CommonBoolResponseProto);
  rpc Login (AccountLoginQuery) returns (AccountLoginResponseProto);
  rpc RefreshToken (AccountRefreshTokenQuery) returns (AccountLoginResponseProto);
  rpc GetLogonTokenBySessionId (AccountGetLogonInfoBySessionIdQuery) returns (AccountLoginResponseProto);
  rpc IsValidLogonPermissionExceptionControllers (AccountPermissionExceptionCachingCheckValidQuery) returns (CommonBoolResponseProto);
  rpc LogOut (AccountLogoutQuery) returns (CommonStringResponseProto);
}

service AccountInfoProtoService {
  rpc AccountInfoGetByAccountIds (AccountInfoGetByAccountIdsQuery) returns (AccountInfoListResponseProto);
  rpc AccountInfoGetByAccountId (AccountInfoGetByAccountIdQuery) returns (AccountInfoResponseProto);
  rpc AccountInfoAddOrChange (AccountInfoAddOrChangeCommand) returns (CommonResponseProto);
  rpc AccountAddressesAddOrChange (AccountAddressesAddOrChangeCommand) returns (CommonResponseProto);
}

service AccountGroupProtoService {
  rpc GroupAddOrChange (AccountGroupAddOrChangeCommand) returns (CommonResponseProto);
  rpc GroupCopy (AccountGroupCopyCommand) returns (CommonResponseProto);
  rpc Search (AccountGroupSearchQuery) returns (CommonResponseProto);
  rpc GroupOrMemberDelete (AccountGroupDeleteCommand) returns (CommonResponseProto);
}

service AccountPermissionProtoService {
  rpc AccountPermissionExceptionQuickGetByAccountId (AccountPermissionExceptionGetByAccountIdQuery) returns (AccountPermissionExceptionListResponseProto);
  rpc SyncPermissionWithController (AccountPermissionControllersSyncCommand) returns (CommonBoolResponseProto);
  rpc ClearOldControllersVersion (AccountPermissionControllerDeleteByHostCodeAndVersionIdCommand) returns (CommonBoolResponseProto);
  rpc AddOrChangeAccountPermissionException (AccountPermissionExceptionsAddOrChangeCommand) returns (CommonBoolResponseProto);
  rpc AddOrChangeManyAccountPermissionException (AccountPermissionExceptionAddOrChangeManyCommand) returns (CommonBoolResponseProto);
}

// --- Common Response Envelopes ---

message CommonResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
}

message CommonBoolResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  bool data = 7;
}

message CommonStringResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  optional string data = 7;
}

// --- Authentication Messages ---

message AccountSignupCommand {
  string email = 1;
  string phone_number = 2;
  string user_name = 3;
  string password = 4;
  optional int32 login_type = 5;
  int32 auth_type = 6;
  string client_id = 7;
  optional string signup_ip = 8;
  optional string device_signup_info = 9;
  optional string authen_application_id = 10;
  string full_name = 11;
  optional string avatar_url = 12;
  optional string process_uid = 13;
}

message AccountSetStatusCommand {
  string account_id = 1;
  int32 account_status = 2;
  optional string process_uid = 3;
}

message AccountChangePasswordCommand {
  string account_id = 1;
  string new_password = 2;
  optional string process_uid = 3;
}

message AccountLoginQuery {
  optional string email = 1;
  optional string phone_number = 2;
  optional string user_name = 3;
  optional string password = 4;
  optional int32 login_type = 5;
  int32 auth_type = 6;
  string client_id = 7;
  optional string ip = 8;
  optional string device_login_info = 9;
  optional string authen_application_id = 10;
  bool is_enable_multi_device = 11;
  optional string process_uid = 12;
}

message AccountRefreshTokenQuery {
  string refresh_token = 1;
  optional string device_info = 2;
  optional int32 login_type = 3;
  int32 auth_type = 4;
  string session_id = 5;
  optional string process_uid = 6;
}

message AccountGetLogonInfoBySessionIdQuery {
  string session_id = 1;
  optional string process_uid = 2;
}

message AccountLogoutQuery {
  string session_id = 1;
  optional string process_uid = 2;
}

message AccountPermissionExceptionCachingCheckValidQuery {
  string account_id = 1;
  string controller_code = 2;
  bool is_has_base_permission = 3;
}

message AccountLoginRModel {
  optional string id = 1;
  string account_id = 2;
  string user_name = 3;
  string password = 4;
  int32 auth_type = 5;
  int32 login_type = 6;
  optional int64 permission = 7;
  optional string full_name = 8;
  optional string phone_number = 9;
  optional string device_id = 10;
  optional string token = 11;
  optional string refresh_token = 12;
  optional int64 created_at_unix_ms = 13;
  optional int64 updated_at_unix_ms = 14;
  string session_id = 15;
  int32 minute_expire = 16;
  int32 token_status = 17;
  optional string email = 18;
  optional string avatar_url = 19;
}

message AccountLoginResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  optional AccountLoginRModel data = 7;
}

// --- Account Info & Address Messages ---

message AccountInfoGetByAccountIdQuery {
  string account_id = 1;
}

message AccountInfoGetByAccountIdsQuery {
  repeated string account_ids = 1;
}

message AccountAddressRModel {
  string id = 1;
  string account_id = 2;
  optional string country_id = 3;
  optional string province_id = 4;
  optional string district_id = 5;
  optional string ward_id = 6;
  optional string address_line = 7;
  int32 address_type = 8;
  optional int64 created_at_unix_ms = 9;
  optional int64 updated_at_unix_ms = 10;
}

message AccountInfoRModel {
  string account_id = 1;
  optional string country_id = 2;
  optional string province_id = 3;
  optional string district_id = 4;
  optional string ward_id = 5;
  optional string full_name = 6;
  optional int64 date_of_birth_unix_ms = 7;
  optional int32 gender = 8;
  optional string address = 9;
  optional string occupation = 10;
  optional string marital_status = 11;
  optional string bio = 12;
  optional string website = 13;
  optional string social_links = 14;
  optional string identification_number = 15;
  optional string passport_number = 16;
  optional string tax_code = 17;
  optional string company_name = 18;
  optional string company_address = 19;
  int32 status = 20;
  string id = 21;
  repeated AccountAddressRModel addresses = 22;
  optional int64 created_at_unix_ms = 23;
  optional int64 updated_at_unix_ms = 24;
}

message AccountInfoResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  optional AccountInfoRModel data = 7;
}

message AccountInfoListResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  repeated AccountInfoRModel data = 7;
}

message AccountInfoAddOrChangeCommand {
  string account_id = 1;
  optional string full_name = 2;
  optional int64 date_of_birth_unix_ms = 3;
  optional int32 gender = 4;
  optional string occupation = 5;
  optional string marital_status = 6;
  optional string bio = 7;
  optional string website = 8;
  optional string social_links = 9;
  optional string identification_number = 10;
  optional string passport_number = 11;
  optional string tax_code = 12;
  optional string company_name = 13;
  optional string company_address = 14;
  optional string country_id = 15;
  optional string province_id = 16;
  optional string district_id = 17;
  optional string ward_id = 18;
  optional string address_line = 19;
}

message AccountAddressAddOrChangeCommand {
  string account_id = 1;
  optional string country_id = 2;
  optional string province_id = 3;
  optional string district_id = 4;
  optional string ward_id = 5;
  optional string address_line = 6;
  int32 address_type = 7;
}

message AccountAddressesAddOrChangeCommand {
  repeated AccountAddressAddOrChangeCommand items = 1;
}

// --- Account Group Messages ---

message AccountGroupAddOrChangeCommand {
  optional string group_id = 1;
  string leader = 2;
  repeated string members = 3;
  optional string group_name = 4;
  repeated int32 group_types = 5;
}

message AccountGroupCopyComponentCommand {
  string leader = 1;
  optional string group_name = 2;
  repeated string member_excludes = 3;
  repeated string member_adds = 4;
  repeated int32 group_types = 5;
}

message AccountGroupCopyCommand {
  string group_id_need_copy = 1;
  repeated AccountGroupCopyComponentCommand components = 2;
}

message AccountGroupSearchQuery {
  optional string keyword = 1;
  optional string leader = 2;
  int32 page_size = 3;
  int32 page_index = 4;
}

message AccountGroupDeleteCommand {
  string group_id = 1;
  string leader = 2;
  repeated string members = 3;
  optional string group_name = 4;
}

// --- Account Permission Messages ---

message AccountPermissionExceptionGetByAccountIdQuery {
  string account_id = 1;
}

message AccountPermissionExceptionRModel {
  string account_id = 1;
  string controller_code = 2;
  int32 access_permission = 3;
}

message AccountPermissionExceptionListResponseProto {
  bool status = 1;
  optional int32 error_code = 2;
  repeated string error_messages = 3;
  int32 version = 4;
  int64 server_time_unix_ms = 5;
  optional int32 total_row = 6;
  repeated AccountPermissionExceptionRModel data = 7;
}

message AccountPermissionControllerAddOrChangeCommand {
  string host_code = 1;
  string version_id = 2;
  string controller_name = 3;
  int64 permission = 4;
  optional string description = 5;
  optional int64 required_permission = 6;
}

message AccountPermissionControllersSyncCommand {
  repeated AccountPermissionControllerAddOrChangeCommand items = 1;
}

message AccountPermissionControllerDeleteByHostCodeAndVersionIdCommand {
  string host_code = 1;
  string version_id = 2;
}

message AccountPermissionExceptionAddOrChangeCommand {
  string account_id = 1;
  string controller_code = 2;
  int32 access_permission = 3;
}

message AccountPermissionExceptionsAddOrChangeCommand {
  repeated AccountPermissionExceptionAddOrChangeCommand items = 1;
}

message AccountPermissionExceptionAddOrChangeManyControllerCodeCommand {
  string controller_code = 1;
  int32 access_permission = 2;
}

message AccountPermissionExceptionAddOrChangeManyCommand {
  repeated string account_ids = 1;
  repeated string group_ids = 2;
  repeated AccountPermissionExceptionAddOrChangeManyControllerCodeCommand controller_components = 3;
}
