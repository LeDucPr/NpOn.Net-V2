apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: npon-v2

resources:
  # 00 - Base namespace, shared config & secret
  - 00-base/namespace.yaml

  # 01 - Databases
  - 01-databases/postgres.yaml
  - 01-databases/scylladb.yaml
  - 01-databases/clickhouse.yaml
  - 01-databases/mongodb.yaml
  - 01-databases/mysql.yaml
  - 01-databases/cockroachdb.yaml
  - 01-databases/trino.yaml

  # 02 - Cache & Messaging
  - 02-cache-messaging/dragonfly.yaml
  - 02-cache-messaging/redis.yaml
  - 02-cache-messaging/rabbitmq.yaml
  - 02-cache-messaging/redpanda-kafka.yaml

  # 03 - Search & Observability
  - 03-search-observability/elasticsearch-kibana.yaml
  - 03-search-observability/monitoring-stack.yaml

  # 04 - Edge & Platform
  - 04-edge-platform/cloudflare-warp-nginx.yaml
  - 04-edge-platform/rancher.yaml

  # 05 - Microservices (Option 3B Envoy Sidecar ServiceMesh)
  - 05-microservices/envoy-3b-configmap.yaml
  - 05-microservices/sso-controller.yaml
  - 05-microservices/account-service.yaml
  - 05-microservices/general-service.yaml
