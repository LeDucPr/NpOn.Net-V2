apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-secret
  namespace: npon-v2
type: Opaque
stringData:
  ELASTIC_PASSWORD: "NpOn.Net-V2"
  KIBANA_PASSWORD: "NpOn.Net-V2"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-certs-pvc
  namespace: npon-v2
spec:
  # Use ReadWriteMany in multi-node clusters, or ReadWriteOnce when pods co-locate on a single node
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: npon-v2
  labels:
    app: elasticsearch
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
  selector:
    app: elasticsearch
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: npon-v2
  labels:
    app: elasticsearch
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
  selector:
    app: elasticsearch
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-cert-init
  namespace: npon-v2
  labels:
    app: elasticsearch
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0
      containers:
        - name: cert-init
          image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              if [ ! -f /usr/share/elasticsearch/config/certs/ca/ca.crt ]; then
                bin/elasticsearch-certutil ca --silent --pem -out /tmp/ca.zip
                unzip -o /tmp/ca.zip -d /usr/share/elasticsearch/config/certs
              fi
              if [ ! -f /usr/share/elasticsearch/config/certs/elasticsearch-0/elasticsearch-0.crt ]; then
                cat > /tmp/instances.yml <<'EOF'
              instances:
                - name: elasticsearch-0
                  dns:
                    - elasticsearch-0
                    - elasticsearch-0.elasticsearch-headless.npon-v2.svc.cluster.local
                    - elasticsearch
                    - localhost
                - name: elasticsearch-1
                  dns:
                    - elasticsearch-1
                    - elasticsearch-1.elasticsearch-headless.npon-v2.svc.cluster.local
                    - elasticsearch
                    - localhost
              EOF
                bin/elasticsearch-certutil cert --silent --pem -out /tmp/certs.zip \
                  --in /tmp/instances.yml \
                  --ca-cert /usr/share/elasticsearch/config/certs/ca/ca.crt \
                  --ca-key /usr/share/elasticsearch/config/certs/ca/ca.key
                unzip -o /tmp/certs.zip -d /usr/share/elasticsearch/config/certs
              fi
              chown -R 1000:0 /usr/share/elasticsearch/config/certs
          volumeMounts:
            - name: certs
              mountPath: /usr/share/elasticsearch/config/certs
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: certs
          persistentVolumeClaim:
            claimName: elasticsearch-certs-pvc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: npon-v2
  labels:
    app: elasticsearch
spec:
  serviceName: elasticsearch-headless
  replicas: 2
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: node.name
              value: "$(NODE_NAME)"
            - name: cluster.name
              value: "es-docker-cluster"
            - name: cluster.initial_master_nodes
              value: "elasticsearch-0,elasticsearch-1"
            - name: discovery.seed_hosts
              value: "elasticsearch-0.elasticsearch-headless.npon-v2.svc.cluster.local,elasticsearch-1.elasticsearch-headless.npon-v2.svc.cluster.local"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-secret
                  key: ELASTIC_PASSWORD
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.transport.ssl.enabled
              value: "true"
            - name: xpack.security.transport.ssl.key
              value: "certs/$(NODE_NAME)/$(NODE_NAME).key"
            - name: xpack.security.transport.ssl.certificate
              value: "certs/$(NODE_NAME)/$(NODE_NAME).crt"
            - name: xpack.security.transport.ssl.certificate_authorities
              value: "certs/ca/ca.crt"
            - name: xpack.security.transport.ssl.verification_mode
              value: "certificate"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms4g -Xmx4g"
          volumeMounts:
            - name: certs
              mountPath: /usr/share/elasticsearch/config/certs
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"
      volumes:
        - name: certs
          persistentVolumeClaim:
            claimName: elasticsearch-certs-pvc
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-kibana-password-setup
  namespace: npon-v2
  labels:
    app: elasticsearch
spec:
  backoffLimit: 15
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: password-setup
          image: curlimages/curl:latest
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-secret
                  key: ELASTIC_PASSWORD
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-secret
                  key: KIBANA_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              until curl -sf -u "elastic:${ELASTIC_PASSWORD}" "http://elasticsearch.npon-v2.svc.cluster.local:9200/_cluster/health"; do
                echo "Waiting for Elasticsearch..."
                sleep 5
              done
              curl -sf -u "elastic:${ELASTIC_PASSWORD}" \
                -X POST "http://elasticsearch.npon-v2.svc.cluster.local:9200/_security/user/kibana_system/_password" \
                -H "Content-Type: application/json" \
                -d "{\"password\":\"${KIBANA_PASSWORD}\"}"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kibana-data
  namespace: npon-v2
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: npon-v2
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.2.4
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch.npon-v2.svc.cluster.local:9200"]'
            - name: ELASTICSEARCH_USERNAME
              value: "kibana_system"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-secret
                  key: KIBANA_PASSWORD
          volumeMounts:
            - name: kibana-data
              mountPath: /usr/share/kibana/data
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: kibana-data
          persistentVolumeClaim:
            claimName: kibana-data
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: npon-v2
  labels:
    app: kibana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5601
      targetPort: 5601
  selector:
    app: kibana
