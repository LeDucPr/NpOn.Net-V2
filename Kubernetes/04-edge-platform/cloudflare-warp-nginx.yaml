apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-nginx-config
  namespace: npon-v2
data:
  nginx.conf: |
    events {
        worker_connections 4096;
    }

    stream {
        upstream proxy_pool {
            least_conn;
            server cf-node.npon-v2.svc.cluster.local:1080;
        }

        server {
            listen 24000;
            proxy_pass proxy_pool;
            proxy_connect_timeout 5s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cf-node
  namespace: npon-v2
  labels:
    app: cf-node
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cf-node
  template:
    metadata:
      labels:
        app: cf-node
    spec:
      containers:
        - name: cf-node
          image: caomingjun/warp:latest
          ports:
            - containerPort: 1080
              name: socks5
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cf-node
  namespace: npon-v2
  labels:
    app: cf-node
spec:
  type: ClusterIP
  ports:
    - name: socks5
      port: 1080
      targetPort: 1080
  selector:
    app: cf-node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-nginx-balancer
  namespace: npon-v2
  labels:
    app: cloudflare-nginx-balancer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-nginx-balancer
  template:
    metadata:
      labels:
        app: cloudflare-nginx-balancer
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 24000
              name: socks-lb
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 24000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: cloudflare-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-nginx-balancer
  namespace: npon-v2
  labels:
    app: cloudflare-nginx-balancer
spec:
  type: ClusterIP
  ports:
    - name: socks-lb
      port: 24000
      targetPort: 24000
  selector:
    app: cloudflare-nginx-balancer
