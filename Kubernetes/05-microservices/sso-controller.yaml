apiVersion: v1
kind: ServiceAccount
metadata:
  name: sso-controller
  namespace: npon-v2
---
apiVersion: v1
kind: Service
metadata:
  name: sso-controller
  namespace: npon-v2
  labels:
    app: sso-controller
spec:
  type: ClusterIP
  ports:
    - name: http-rest-grpc
      port: 14023
      targetPort: 14023
    - name: public-grpc
      port: 15023
      targetPort: 15023
    - name: envoy-mtls
      port: 15443
      targetPort: 15443
    - name: envoy-admin
      port: 9901
      targetPort: 9901
  selector:
    app: sso-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-controller
  namespace: npon-v2
  labels:
    app: sso-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sso-controller
  template:
    metadata:
      labels:
        app: sso-controller
    spec:
      serviceAccountName: sso-controller
      containers:
        - name: sso-controller
          image: ghcr.io/leducpr/sso-controller:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 14023
              name: http-rest-grpc
            - containerPort: 15023
              name: public-grpc
          envFrom:
            - configMapRef:
                name: npon-common-config
            - secretRef:
                name: npon-interservice-secret
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:14023"
            - name: HostDomain
              value: "http://0.0.0.0"
            - name: HostPort
              value: "14023"
            - name: PublicGrpcHostPort
              value: "15023"
            - name: AccountServiceUrl
              value: "http://127.0.0.1:15004"
            - name: InterServiceAuthMode
              value: "ServiceMesh"
          readinessProbe:
            httpGet:
              path: /
              port: 14023
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 14023
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "2"]
          ports:
            - containerPort: 15443
              name: envoy-mtls
            - containerPort: 9901
              name: envoy-admin
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy-sso.yaml
              readOnly: true
            - name: mesh-certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: envoy-config
          configMap:
            name: npon-envoy-3b-config
        - name: mesh-certs
          secret:
            secretName: npon-mesh-certs-sso
            optional: true
