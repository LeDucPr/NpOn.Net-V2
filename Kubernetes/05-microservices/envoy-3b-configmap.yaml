apiVersion: v1
kind: ConfigMap
metadata:
  name: npon-envoy-3b-config
  namespace: npon-v2
data:
  envoy-sso.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901
    static_resources:
      listeners:
        - name: inbound_mtls_grpc
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 15443
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_params:
                      tls_minimum_protocol_version: TLSv1_3
                      tls_maximum_protocol_version: TLSv1_3
                    tls_certificates:
                      - certificate_chain:
                          filename: /certs/svid.crt
                        private_key:
                          filename: /certs/svid.key
                    validation_context:
                      trusted_ca:
                        filename: /certs/ca.crt
                      match_typed_subject_alt_names:
                        - san_type: URI
                          matcher:
                            prefix: "spiffe://cluster.local/"
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: inbound_sso_3b
                    http2_protocol_options: {}
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details:
                      uri: true
                      subject: true
                      dns: true
                    route_config:
                      name: local_sso_route
                      virtual_hosts:
                        - name: local_sso
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                                grpc: {}
                              route:
                                cluster: local_app_h2c
                                timeout: 0s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        - name: outbound_mtls_accountservice
          address:
            socket_address:
              address: 127.0.0.1
              port_value: 15004
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: outbound_account_3b
                    http2_protocol_options: {}
                    route_config:
                      name: account_route
                      virtual_hosts:
                        - name: account_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: accountservice_mtls
                                timeout: 0s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        - name: outbound_mtls_generalservice
          address:
            socket_address:
              address: 127.0.0.1
              port_value: 15000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: outbound_general_3b
                    http2_protocol_options: {}
                    route_config:
                      name: general_route
                      virtual_hosts:
                        - name: general_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: generalservice_mtls
                                timeout: 0s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: local_app_h2c
          type: STATIC
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: local_app_h2c
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 14023

        - name: accountservice_mtls
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_3
                tls_certificates:
                  - certificate_chain:
                      filename: /certs/svid.crt
                    private_key:
                      filename: /certs/svid.key
                validation_context:
                  trusted_ca:
                    filename: /certs/ca.crt
                  match_typed_subject_alt_names:
                    - san_type: URI
                      matcher:
                        exact: "spiffe://cluster.local/ns/npon-v2/sa/account-service"
          load_assignment:
            cluster_name: accountservice_mtls
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: account-service.npon-v2.svc.cluster.local
                          port_value: 15443

        - name: generalservice_mtls
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_3
                tls_certificates:
                  - certificate_chain:
                      filename: /certs/svid.crt
                    private_key:
                      filename: /certs/svid.key
                validation_context:
                  trusted_ca:
                    filename: /certs/ca.crt
                  match_typed_subject_alt_names:
                    - san_type: URI
                      matcher:
                        exact: "spiffe://cluster.local/ns/npon-v2/sa/general-service"
          load_assignment:
            cluster_name: generalservice_mtls
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: general-service.npon-v2.svc.cluster.local
                          port_value: 15443

