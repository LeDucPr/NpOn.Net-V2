Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Warning

Kestrel:
  EndpointDefaults:
    Protocols: Http2

AppName: GeneralService
IsUseDataProtectionAutomaticKeyGeneration: true

# Inter-service authentication
InterServiceUseMTLS: true
InterServiceAutoGenerateCertificates: true
InterServiceCertificateValidityDays: 90
InterServiceCertificateStoragePath: "/certs"
InterServiceClientCertPath: "/certs/general-client.pfx"
InterServiceClientCertPassword: "NpOn_V2_Cert_Password"
InterServiceServerCertPath: "/certs/general-server.pfx"
InterServiceServerCertPassword: "NpOn_V2_Cert_Password"
InterServiceCACertPath: "/certs/ca.crt"

# Fallback JWT (for gradual migration)
InterServiceSecretKey: "NpOn-InterService-Secret-Key-2024-Change-In-Production"
InterServiceTokenLifetimeMinutes: 60
InterServiceKeyRotationMinutes: 360


CookieDomain: ".npon_v2"  
CookieAuthenName: NpOn
JwtTokensKey: "h987HG&H&G$T*h*8Yo8Y!&iy8ttg*I$%U_YhKJ$#uG8Q7T_G^87!G@H9QN87*tyh&H$uM!iy$G7_68Rf&$*hY97^8Hu_iYG8!67GFtfG87TG*&^tKioGTK"

IsStartAsync: false
IsUseGrpcStandardMode: true
IsUseEnableUnencryptedMode: true
HostPort: 40000
HostDomain: "http://0.0.0.0"
IsUseCachingExecutionGeneralService: true

IsUsePostgres: true
PostgresConnectionString: "Host=localhost;Port=5432;Username=postgres;Password=password;Database=general;"
PostgresConnectionNumber: 100
WorkerThreadMin: 2500

#CORS: "*"
#CorsPolicy: NpOnCorsPolicy

DnsResolverFactory: 60
KeepAlivePingDelaySeconds: 60
KeepAlivePingTimeoutSeconds: 30
IsAutomaticKeyGeneration: true
IsDevEnvironment: true

IsUseMiddlewareLogger: true

#AccountServiceUrl: "http://localhost:40004"
